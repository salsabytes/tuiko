# CI tuiko — auto-test tiap push/PR, semua OS + semua Python yang didukung.
# Jalur test lokal: python -m unittest discover -s tests -v
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install .
      - name: Smoke — import + versi
        run: python -c "import tuiko; print('tuiko', tuiko.__version__)"
      - name: Test
        run: python -m unittest discover -s tests -v
