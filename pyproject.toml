[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuiko"
version = "0.2.0"
description = "mikro-framework TUI Python stdlib-only (nol dependency pihak ketiga)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tuiko = "tuiko.demo:main"

[tool.setuptools.packages.find]
include = ["tuiko*"]
