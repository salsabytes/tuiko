[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tuiko"
version = "0.1.2"
description = "Tiny stdlib-only TUI framework for Python — zero third-party dependencies"
readme = "README.md"
license = "MIT"
authors = [{ name = "salsabytes" }]
requires-python = ">=3.10"
keywords = ["tui", "terminal", "cli", "ansi", "interactive"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.scripts]
tuiko = "tuiko.demo:main"

[project.urls]
Homepage = "https://github.com/salsabytes/tuiko"
Repository = "https://github.com/salsabytes/tuiko"

[tool.setuptools.packages.find]
include = ["tuiko*"]
